<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font search path for the Persian edition (fa/main.tex).

  MiKTeX's XeTeX resolves font names through fontconfig, which on Windows
  finds neither font directory on its own. Two are needed:

    C:/Windows/Fonts   machine-wide fonts (Segoe UI, Consolas)
    ~/AppData/...      per-user installed fonts (IRLotus, IRYekan)

  The Persian faces are installed per user, not machine-wide, so the second
  entry is what makes `IRLotus` and `IRYekan` resolvable. `~` is expanded by
  fontconfig to the current user's profile, so this file is not tied to one
  account.

  Point FONTCONFIG_FILE at this file before running xelatex; see ../README.md.
-->
<fontconfig>
  <dir>C:/Windows/Fonts</dir>
  <dir>~/AppData/Local/Microsoft/Windows/Fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
