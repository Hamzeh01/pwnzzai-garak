name: pwnzzai-phase2

services:
  pwnzzai-app:
    image: localhost:5000/owasp/pwnzzai@sha256:7878fbd790a0cc6f698950722b79760aabbb945dcb59a4996bfa2a3937f4849a
    pull_policy: never
    ports: !override
      - "127.0.0.1:18080:8080"
    volumes: !override
      - ../../uploads:/app/uploads
      - ../../downloads:/app/downloads
      - ../../instance:/app/instance
    environment:
      SECRET_KEY: ${PWNZZAI_PHASE2_SECRET_KEY:?set PWNZZAI_PHASE2_SECRET_KEY at runtime}
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:1b
      OLLAMA_FALLBACK_MODEL: llama3.2:1b
